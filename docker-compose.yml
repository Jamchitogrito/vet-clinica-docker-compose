volumes:
  my-datavolume:
services:
  db:
    image: mysql
    volumes:
      - my-datavolume:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vet_klinika2
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:5125"
    environment:
      - DBHOST=db
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - my-network
networks:
  my-network: